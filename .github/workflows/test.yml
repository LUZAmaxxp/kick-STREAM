name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (frontend)
        run: npm ci
      - name: Install dependencies (backend)
        run: |
          cd backend
          npm ci
      - name: Run frontend tests
        run: npm test || true
      - name: Run backend tests
        run: |
          cd backend
          npm test || true
